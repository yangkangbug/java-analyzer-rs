name: editor-acceptance

# Optional official-client network gate, distinct from native offline tests.
# Execute reviewed main only, never pull_request_target or arbitrary PR code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editor-acceptance.yml'
      - 'src/**'
      - 'editors/neovim/**'
      - 'scripts/*neovim*'
      - 'scripts/fetch-acceptance-inputs.py'
      - 'examples/cli_project/**'
      - 'tests/fixtures/classes/Lib.class'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: editor-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neovim:
    if: github.ref == 'refs/heads/main'
    name: Neovim 0.11.5 (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.96.0
      - name: Offline client-input regressions
        run: python3 -m unittest discover -s scripts -p 'test_neovim*.py' -v
      - name: Build native analyzer (no Java)
        run: cargo build --release --locked --features cli --bin java-analyzer
      - name: Fetch exact official client archive (network setup only)
        run: >-
          python3 scripts/fetch-neovim-input.py
          --cache "$RUNNER_TEMP/neovim-cache"
          --output "$RUNNER_TEMP/neovim"
          --platform '${{ matrix.platform }}'
      - name: Fetch pinned legacy adapter (public network setup only, never execute here)
        timeout-minutes: 2
        run: >-
          python3 scripts/fetch-neovim-legacy-adapter.py
          --output "$RUNNER_TEMP/neovim-legacy-adapter"
      - name: Real isolated headless editor navigation (native analysis has no Java PATH)
        run: >-
          python3 scripts/check-neovim-editor.py
          --nvim "$RUNNER_TEMP/neovim/bin/nvim"
          --native "$GITHUB_WORKSPACE/target/release/java-analyzer"
          --output "$RUNNER_TEMP/neovim-result"
      - name: Real explicit restart and unsaved-buffer replay (no Java)
        run: >-
          python3 scripts/check-neovim-refresh.py
          --nvim "$RUNNER_TEMP/neovim/bin/nvim"
          --native "$GITHUB_WORKSPACE/target/release/java-analyzer"
          --output "$RUNNER_TEMP/neovim-refresh-result"
      - name: Require exact legacy excluded-buffer failure (CI-only negative control)
        run: >-
          python3 scripts/check-neovim-source-exclusions.py
          --nvim "$RUNNER_TEMP/neovim/bin/nvim"
          --native "$GITHUB_WORKSPACE/target/release/java-analyzer"
          --adapter "$RUNNER_TEMP/neovim-legacy-adapter"
          --scenario excluded_buffers
          --expect-legacy-exclusion-failure
          --output "$RUNNER_TEMP/neovim-exclusions-legacy-result"
      - name: Real source exclusions and explicit selection restart (same native candidate, no Java)
        run: >-
          python3 scripts/check-neovim-source-exclusions.py
          --nvim "$RUNNER_TEMP/neovim/bin/nvim"
          --native "$GITHUB_WORKSPACE/target/release/java-analyzer"
          --output "$RUNNER_TEMP/neovim-exclusions-result"
      - name: Record bounded verification summary (no source text or private paths)
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'neovim-result/result.json').read_text())
          identity = report['identity']
          print(json.dumps({
              'host_system': platform.system(), 'host_machine': platform.machine(),
              'source_revision': identity['source_revision'], 'source_tree': identity['source_tree'],
              'source_dirty': identity['source_dirty'],
              'native_sha256': identity['native_sha256'], 'neovim_sha256': identity['neovim_sha256'],
              'adapter_sha256': identity['adapter_sha256'], 'editor': report['editor'],
              'native_sessions_cleanly_exited': report['native_sessions_cleanly_exited'],
              'native_no_java_environment': report['native_no_java_environment'],
              'unchanged_inputs': report['unchanged_inputs'],
              'unchanged_executables': report['unchanged_executables'],
              'process': report['process'],
          }, indent=2))
          refresh = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'neovim-refresh-result/result.json').read_text())
          print(json.dumps(refresh['summary'], indent=2))
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          legacy = json.loads((base / 'neovim-exclusions-legacy-result/result.json').read_text())
          exclusions = json.loads((base / 'neovim-exclusions-result/result.json').read_text())
          for checked in (refresh, legacy, exclusions):
              for key in ('native_sha256', 'neovim_sha256', 'source_revision', 'source_tree', 'source_dirty'):
                  assert checked['identity'][key] == identity[key], 'gates used different candidate/client sources'
          assert exclusions['identity']['adapter_sha256'] == identity['adapter_sha256']
          assert exclusions['identity']['adapter_override'] is False
          assert legacy['identity']['adapter_sha256'] == 'a8be5c2bd9f85c2428ccc65492bccc31592f2131125412892736639c48e78ab6'
          assert legacy['summary']['negative_control'] is True
          assert legacy['summary']['expected_failure'] == 'EXCLUDED_BUFFER_ATTACHED'
          assert legacy['summary']['ok'] and legacy['summary']['passed'] == legacy['summary']['total'] == 1
          assert exclusions['summary']['ok'] and exclusions['summary']['passed'] == exclusions['summary']['total'] == 4
          print(json.dumps(legacy['summary'], indent=2))
          print(json.dumps(exclusions['summary'], indent=2))
          PY
      - name: Remove temporary client and owned acceptance data (never uploaded)
        if: always()
        run: >-
          rm -rf -- "$RUNNER_TEMP/neovim" "$RUNNER_TEMP/neovim-cache"
          "$RUNNER_TEMP/neovim-result" "$RUNNER_TEMP/neovim-refresh-result"
          "$RUNNER_TEMP/neovim-legacy-adapter" "$RUNNER_TEMP/neovim-exclusions-legacy-result"
          "$RUNNER_TEMP/neovim-exclusions-result"

# A failed download is a setup failure, not a passed or skipped editor test.
# Headless navigation is not GUI, signed-distribution or user-device validation.
