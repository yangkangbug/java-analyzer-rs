name: extended-acceptance

# Optional network/data/compiler gate, separate from mandatory JVM-free ci.
# Manual runs are restricted to main too; no PR code or pull_request_target.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extended-acceptance.yml'
      - 'scripts/acceptance-inputs.json'
      - 'scripts/fetch-acceptance-inputs.py'
      - 'scripts/test_fetch_acceptance_inputs.py'
      - 'scripts/check-real-source.py'
      - 'scripts/check-cli-acceptance.py'
      - 'scripts/check-configure-acceptance.py'
      - 'scripts/test_configure_acceptance.py'
      - 'scripts/second-project-inputs.json'
      - 'scripts/fetch-second-project-inputs.py'
      - 'scripts/test_second_project_inputs.py'
      - 'scripts/check-second-project.py'
      - 'scripts/test_second_project.py'
      - 'scripts/test_local_type_acceptance.py'
      - 'scripts/test_reference_call_acceptance.py'
      - 'scripts/test_reference_oracle.py'
      - 'scripts/check-constructor-oracle.py'
      - 'scripts/test_constructor_oracle.py'
      - 'scripts/test_constructor_call_acceptance.py'
      - 'scripts/check-string-call-acceptance.py'
      - 'scripts/test_string_call_acceptance.py'
      - 'scripts/check-string-oracle.py'
      - 'scripts/test_string_oracle.py'
      - 'scripts/check-strict-reference-acceptance.py'
      - 'scripts/test_strict_reference_acceptance.py'
      - 'scripts/check-strict-reference-oracle.py'
      - 'scripts/test_strict_reference_oracle.py'
      - 'scripts/check-editor-project.py'
      - 'scripts/test_editor_project.py'
      - 'scripts/check-lsp-project.py'
      - 'scripts/test_lsp_project.py'
      - 'examples/lsp_preview/**'
      - 'examples/editor_buffers/**'
      - 'tests/cli_overlays.rs'
      - 'tests/overlays.rs'
      - 'tests/positions.rs'
      - 'examples/second_project/**'
      - 'scripts/check-cli-runtime.sh'
      - 'scripts/check-semantic-oracle.py'
      - 'examples/real_source/**'
      - 'examples/real_source.rs'
      - 'examples/oracle_bindings.rs'
      - 'dev-tools/oracle/**'
      - 'src/**'
      - 'rust-toolchain.toml'
      - 'tests/cli.rs'
      - 'tests/cli_configure.rs'
      - 'tests/reference_calls.rs'
      - 'tests/cli_lsp.rs'
      - 'examples/cli_project/**'
      - 'examples/cli_acceptance/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: extended-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-inputs-and-oracle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Official refs verified through GitHub API; fixed commits, not floating tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action implementation
        with:
          toolchain: 1.96.0
      - name: Offline fetch-security unit tests (no Java)
        run: python3 -m unittest discover -s scripts -p 'test_fetch_acceptance_inputs.py' -v
      - name: Build native acceptance executables (no Java)
        run: cargo build --locked --features cli --bin java-analyzer --example real_source --example oracle_bindings
      - name: Fetch exact external inputs (network gate, no Java execution)
        run: >-
          python3 scripts/fetch-acceptance-inputs.py
          --cache "$RUNNER_TEMP/acceptance-cache"
          --output "$RUNNER_TEMP/acceptance"
          --include-oracle-jdk
      - name: Fetch second project data (no build scripts or Java execution)
        run: >-
          python3 scripts/fetch-second-project-inputs.py
          --cache "$RUNNER_TEMP/acceptance-cache"
          --platform-dir "$RUNNER_TEMP/acceptance/jdk/jmods"
          --output "$RUNNER_TEMP/second-project"
      - name: Analyze real source corpus (Rust child has no Java environment)
        run: >-
          python3 scripts/check-real-source.py
          "$RUNNER_TEMP/acceptance/sources.jar"
          "$RUNNER_TEMP/acceptance/java.base.jmod"
          --profile debug --rounds 1
      - name: Query real project through shipped CLI (no Java environment)
        run: >-
          python3 scripts/check-cli-acceptance.py
          "$RUNNER_TEMP/acceptance/sources.jar"
          "$RUNNER_TEMP/acceptance/java.base.jmod"
          --native target/debug/java-analyzer
      - name: Query second real project through shipped CLI (no Java environment)
        run: >-
          python3 scripts/check-second-project.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
      - name: Additive Gson local-type containment probes (no Java)
        run: >-
          python3 scripts/check-second-project.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
          --local-types
      - name: Additive Gson reference-call proof and preservation (no Java)
        run: >-
          python3 scripts/check-second-project.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
          --reference-calls
      - name: Exact Gson constructor-call correction and preservation (no Java)
        run: >-
          python3 scripts/check-second-project.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
          --constructor-calls
      - name: Additive Gson string-call identities and preserved refusals (no Java)
        run: >-
          python3 scripts/check-string-call-acceptance.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
      - name: Gson strict reference winner and preserved primitive refusals (no Java)
        run: >-
          python3 scripts/check-strict-reference-acceptance.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
      - name: Generate Commons and four-scope Gson configurations and preserve results (no Java)
        run: >-
          python3 scripts/check-configure-acceptance.py
          "$RUNNER_TEMP/acceptance/sources.jar"
          "$RUNNER_TEMP/acceptance/java.base.jmod"
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
      - name: Unsaved buffers through shipped CLI on fixed Gson (no Java)
        run: >-
          python3 scripts/check-editor-project.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
      - name: Fixed Gson cross-owner unsaved navigation through LSP (no Java)
        run: >-
          python3 scripts/check-lsp-project.py
          "$RUNNER_TEMP/second-project"
          --native target/debug/java-analyzer
      - name: Independent javac oracle (optional Java)
        run: >-
          python3 scripts/check-semantic-oracle.py
          --jdk "$RUNNER_TEMP/acceptance/jdk"
          --native target/debug/examples/oracle_bindings
          --sources-jar "$RUNNER_TEMP/acceptance/sources.jar"
      - name: Independent handwritten constructor oracle (optional Java)
        run: >-
          python3 scripts/check-constructor-oracle.py
          --jdk "$RUNNER_TEMP/acceptance/jdk"
          --native target/debug/examples/oracle_bindings
      - name: Independent handwritten string oracle (optional Java)
        run: >-
          python3 scripts/check-string-oracle.py
          --jdk "$RUNNER_TEMP/acceptance/jdk"
          --native target/debug/examples/oracle_bindings
      - name: Independent strict reference phase oracle (optional Java)
        run: |
          jdk_sha="$(python3 -c 'import json; print(json.load(open("scripts/acceptance-inputs.json"))["jdk"]["sha256"])')"
          python3 scripts/check-strict-reference-oracle.py \
            --jdk "$RUNNER_TEMP/acceptance/jdk" \
            --jdk-archive "$RUNNER_TEMP/acceptance-cache/$jdk_sha" \
            --native target/debug/examples/oracle_bindings
      - name: Remove external inputs (never uploaded or redistributed)
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/acceptance" "$RUNNER_TEMP/second-project" "$RUNNER_TEMP/acceptance-cache"

# Pins cover external acceptance archives, not the entire runner/dependency graph.
# Network failure fails setup explicitly; skipped jobs do not constitute acceptance.
