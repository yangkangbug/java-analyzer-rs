name: macos-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native macOS 15 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Verify native host and pinned Rust target
        run: |
          sw_vers
          rustc -vV
          python3 scripts/check-macos-runtime.py --host-only --target '${{ matrix.target }}' --runner-arch '${{ runner.arch }}'
      - name: Offline macOS checker regressions (no Java)
        run: python3 -m unittest discover -s scripts -p 'test_macos_runtime.py' -v
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Native tests with CLI and crash containment
        run: |
          ulimit -c 0
          cargo test --all-targets --all-features --locked
      - run: cargo test --doc --locked
      - run: cargo build --examples --locked
      - name: Native library examples without a Java environment
        run: |
          env -i PATH=/nonexistent "$GITHUB_WORKSPACE/target/debug/examples/resolve"
          sh scripts/check-native-runtime.sh
      - run: cargo build --features cli --bin java-analyzer --locked
      - name: Debug CLI source and binary declarations without Java
        run: sh scripts/check-cli-runtime.sh
      - run: cargo build --release --features cli --bin java-analyzer --locked
      - name: Release Mach-O architecture, linkage and CLI behavior (no upload)
        run: python3 scripts/check-macos-runtime.py --binary target/release/java-analyzer --target '${{ matrix.target }}' --runner-arch '${{ runner.arch }}'
