name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Offline native preview tooling tests (no Java)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: |
          ulimit -c 0
          cargo test --all-targets --all-features --locked
      - run: cargo test --doc --locked
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run --locked --example resolve
      - run: cargo build --examples --locked
      - run: cargo run --example load_session --locked
      - run: sh scripts/check-native-runtime.sh
      - run: cargo build --features cli --bin java-analyzer --locked
      - run: sh scripts/check-cli-runtime.sh
      - name: Build and verify local Linux CLI package (no upload)
        run: python3 scripts/package-cli.py --output "$RUNNER_TEMP/cli-preview"
