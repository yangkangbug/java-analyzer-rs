[package]
name = "java-engine"
description = "Standalone Rust Java engine: lexer, parser, brace-block reparse, class-file signatures, and name binding. No JVM."
version = "0.1.38"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["OpenIDEA contributors"]
readme = "README.md"
publish = false
repository = "https://github.com/yangkangbug/java-analyzer-rs"

[features]
default = []
# Serialization belongs to the executable adapter, not the analysis model.
cli = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "java-analyzer"
path = "src/bin/java-analyzer/main.rs"
required-features = ["cli"]

[dependencies]
# Class-file reader. 0BSD. Direct dependencies: bitflags (MIT OR Apache-2.0),
# cesu8 (MIT OR Apache-2.0). No JVM. See NOTICE.
cafebabe = "0.9.0"
# Native ZIP/DEFLATE only; no encryption, network, extraction, or JVM.
zip = { version = "=9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Strict versioned JSON at the optional CLI boundary. MIT OR Apache-2.0.
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
